services:
  - type: web
    name: vulntriage
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vulntriage-db
          property: connectionString
      - key: QDRANT_HOST
        value: ""
      - key: QDRANT_HTTP_PORT
        value: "6333"
      - key: QDRANT_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NVD_API
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: CORS_ORIGINS
        value: https://vulntriage.onrender.com
      - key: SAFETY_NO_EXPLOIT_CODE
        value: "true"

databases:
  - name: vulntriage-db
    plan: free
    databaseName: vulntriage
    user: vulntriage
